<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Sublimación - Forwarder Venture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { background-color: #F3F4F6; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        .text-fv-blue { color: #002e5f; }
        .bg-fv-blue { background-color: #002e5f; }
        .bg-fv-orange { background-color: #e85d04; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Estilo para los botones de colores/variantes */
        .variant-btn {
            border: 1px solid #e2e8f0;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            transition: all 0.2s;
            background: white;
            cursor: pointer;
        }
        .variant-btn:hover { border-color: #002e5f; background: #f8fafc; }
        .variant-btn.active {
            border-color: #002e5f;
            background: #002e5f;
            color: white;
        }

        .price-active { background-color: #e85d04; color: white !important; transform: scale(1.02); padding: 4px 8px; border-radius: 4px; font-weight: 900 !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div class="max-w-[1400px] mx-auto bg-white min-h-screen shadow-2xl flex flex-col w-full">
        <header class="bg-white/95 backdrop-blur-md px-5 py-3 sticky top-0 z-50 flex justify-between items-center border-b h-[80px]">
            <img src="logo.png" alt="Forwarder Venture" class="w-[120px] object-contain">
            <button onclick="toggleCart()" class="relative p-2 hover:bg-gray-100 rounded-full transition">
                <i class="fa-solid fa-cart-shopping text-2xl text-fv-blue"></i>
                <span id="cart-count" class="absolute top-0 right-0 bg-orange-600 text-white text-[10px] font-bold h-5 w-5 flex items-center justify-center rounded-full border-2 border-white">0</span>
            </button>
        </header>

        <section class="relative w-full h-[25vh] bg-fv-blue overflow-hidden flex items-end p-8">
            <div class="relative z-10">
                <span class="bg-orange-600 text-white px-3 py-1 font-black text-xs uppercase tracking-widest mb-2 inline-block">Catálogo Oficial</span>
                <h2 class="text-white font-black text-3xl md:text-5xl">SUBLIMACIÓN</h2>
            </div>
        </section>

        <div class="sticky top-[80px] z-40 bg-white border-b shadow-sm">
            <nav id="category-nav" class="flex overflow-x-auto gap-3 px-5 py-4 hide-scrollbar"></nav>
        </div>

        <main class="p-4 md:p-10 bg-gray-50 flex-grow">
            <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
                </div>
        </main>
    </div>

    <div id="product-modal" class="hidden fixed inset-0 bg-black/80 z-[2000] flex items-center justify-center p-4 backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div class="bg-white w-full max-w-5xl rounded-2xl overflow-hidden shadow-2xl relative flex flex-col md:flex-row max-h-[90vh]">
            <button onclick="closeProductModal()" class="absolute top-4 right-4 w-10 h-10 bg-gray-100 rounded-full z-10"><i class="fa-solid fa-xmark"></i></button>
            
            <div class="w-full md:w-1/2 bg-gray-50 p-6 flex items-center justify-center border-b md:border-b-0 md:border-r">
                <img id="modal-img" src="" class="w-full h-auto max-h-[400px] object-contain">
            </div>
            
            <div class="w-full md:w-1/2 p-6 md:p-10 overflow-y-auto">
                <span id="modal-category" class="text-xs font-black text-orange-600 uppercase">CATEGORÍA</span>
                <h2 id="modal-title" class="text-2xl font-black text-gray-900 mb-1">Nombre</h2>
                <p class="text-gray-400 text-xs mb-6">SKU ACTUAL: <span id="modal-sku" class="font-bold text-gray-700"></span></p>

                <div id="variant-section" class="mb-8">
                    <label class="text-xs font-bold text-gray-400 uppercase mb-3 block">Selecciona una opción:</label>
                    <div id="variant-container" class="flex flex-wrap gap-2"></div>
                </div>

                <div class="bg-gray-50 rounded-xl p-4 mb-6 border border-gray-100">
                    <p class="text-[10px] font-bold text-gray-400 uppercase mb-3">Precios según cantidad</p>
                    <div class="grid grid-cols-2 gap-x-6 gap-y-2 text-sm">
                        <div id="row-1" class="flex justify-between border-b pb-1"><span>1+ und</span><span id="price-1" class="font-bold"></span></div>
                        <div id="row-12" class="flex justify-between border-b pb-1"><span>12+ und</span><span id="price-12" class="font-bold"></span></div>
                        <div id="row-50" class="flex justify-between border-b pb-1"><span>50+ und</span><span id="price-50" class="font-bold"></span></div>
                        <div id="row-100" class="flex justify-between border-b pb-1"><span>100+ und</span><span id="price-100" class="font-bold"></span></div>
                        <div id="row-200" class="flex justify-between"><span>200+ und</span><span id="price-200" class="font-bold"></span></div>
                    </div>
                </div>

                <div class="mb-8">
                    <label class="text-xs font-bold text-gray-500 mb-2 block uppercase">Cantidad:</label>
                    <div class="flex items-center border-2 border-fv-blue rounded-xl h-14 overflow-hidden w-44">
                        <button onclick="updateQty(-1)" class="w-14 h-full bg-gray-50 text-xl">-</button>
                        <input type="number" id="modal-qty" value="1" min="1" class="w-full text-center font-black text-xl border-none focus:ring-0" oninput="highlightActivePrice()">
                        <button onclick="updateQty(1)" class="w-14 h-full bg-gray-50 text-xl">+</button>
                    </div>
                </div>

                <button id="add-btn" class="w-full bg-fv-blue text-white rounded-xl font-bold h-14 hover:opacity-90 transition">
                    Agregar al Pedido <i class="fa-solid fa-cart-plus ml-2"></i>
                </button>
            </div>
        </div>
    </div>

    <div id="cart-modal" class="hidden fixed inset-0 bg-black/60 z-[3000] flex items-end md:items-center justify-center backdrop-blur-sm">
        <div class="bg-white w-full md:max-w-xl h-[80vh] rounded-t-3xl md:rounded-3xl flex flex-col">
            <div class="p-6 border-b flex justify-between items-center">
                <h2 class="text-xl font-black">Mi Pedido</h2>
                <button onclick="toggleCart()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="cart-items" class="flex-grow p-6 overflow-y-auto bg-gray-50 space-y-4"></div>
            <div class="p-6 border-t">
                <div class="flex justify-between items-center mb-6">
                    <span class="font-bold">TOTAL:</span>
                    <span id="cart-total" class="text-3xl font-black text-fv-blue">$0</span>
                </div>
                <button onclick="sendWhatsApp()" class="w-full bg-[#25D366] text-white py-4 rounded-2xl font-black flex justify-center items-center gap-2">
                    <i class="fa-brands fa-whatsapp text-2xl"></i> Enviar por WhatsApp
                </button>
            </div>
        </div>
    </div>

    <script>
        const WHATSAPP_NUMBER = '3114957971';
        const SHEET_ID = '17a0Pxq1EOLRf86yiuM014ZluVqL2Qj1Mt8cKRDenjHc';
        const GID = '129591070';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

        let groupedProducts = [];
        let cart = [];
        let currentCategory = 'Ver Todo';
        let selectedProduct = null;
        let selectedVariant = null;

        function loadProducts() {
            Papa.parse(CSV_URL, {
                download: true, header: true, skipEmptyLines: true,
                complete: function(results) {
                    const tempGroups = {};
                    
                    results.data.forEach((row, index) => {
                        const parentSku = row['PARENT SKU']?.trim();
                        const sku = row['SKU']?.trim();
                        if(!sku) return;

                        // La clave es el Parent SKU, si no tiene, usamos el SKU individual
                        const key = (parentSku && parentSku !== "") ? parentSku : sku;

                        if (!tempGroups[key]) {
                            tempGroups[key] = {
                                id: key,
                                nombre: row['NOMBRE'],
                                tipo: row['TIPO'] || 'Otros',
                                variaciones: []
                            };
                        }

                        // Agregar esta fila como una variación
                        const parseP = (val) => parseFloat(val?.replace(/[^0-9]/g, '')) || 0;
                        
                        tempGroups[key].variaciones.push({
                            sku: sku,
                            color: row['COLOR'] || '',
                            variable: row['VARIABLE'] || '',
                            imagen: row['IMAGEN'] || 'https://placehold.co/400?text=Sin+Imagen',
                            prices: {
                                p1: parseP(row['PRECIO 1']),
                                p12: parseP(row['PRECIO 12']) || parseP(row['PRECIO 1']),
                                p50: parseP(row['PRECIO 50']) || parseP(row['PRECIO 1']),
                                p100: parseP(row['PRECIO 100']) || parseP(row['PRECIO 1']),
                                p200: parseP(row['PRECIO 200']) || parseP(row['PRECIO 1'])
                            }
                        });
                    });

                    groupedProducts = Object.values(tempGroups);
                    renderCategories();
                    renderProducts(groupedProducts);
                }
            });
        }

        function renderCategories() {
            const cats = ['Ver Todo', ...new Set(groupedProducts.map(p => p.tipo))];
            document.getElementById('category-nav').innerHTML = cats.map(c => `
                <button onclick="filterCat('${c}')" class="px-6 py-2 rounded-full border font-bold whitespace-nowrap ${currentCategory === c ? 'bg-fv-blue text-white' : 'bg-white'}">${c}</button>
            `).join('');
        }

        function filterCat(c) {
            currentCategory = c;
            renderCategories();
            const filtered = c === 'Ver Todo' ? groupedProducts : groupedProducts.filter(p => p.tipo === c);
            renderProducts(filtered);
        }

        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map(p => {
                const first = p.variaciones[0];
                return `
                    <div class="bg-white rounded-xl border p-4 cursor-pointer hover:shadow-lg transition" onclick="openModal('${p.id}')">
                        <div class="aspect-square mb-4 bg-white flex items-center justify-center">
                            <img src="${first.imagen}" class="w-full h-full object-contain">
                        </div>
                        <p class="text-[10px] font-black text-orange-600 uppercase mb-1">${p.tipo}</p>
                        <h3 class="font-bold text-sm leading-tight h-8 overflow-hidden mb-3">${p.nombre}</h3>
                        <div class="flex justify-between items-center">
                            <span class="text-fv-blue font-black">$${first.prices.p1.toLocaleString()}</span>
                            <div class="w-8 h-8 bg-fv-blue text-white rounded-full flex items-center justify-center"><i class="fa-solid fa-plus text-xs"></i></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openModal(id) {
            selectedProduct = groupedProducts.find(p => p.id === id);
            selectedVariant = selectedProduct.variaciones[0];

            document.getElementById('modal-title').innerText = selectedProduct.nombre;
            document.getElementById('modal-category').innerText = selectedProduct.tipo;
            
            // Generar botones de variantes (Color o Variable)
            const container = document.getElementById('variant-container');
            if (selectedProduct.variaciones.length > 1) {
                document.getElementById('variant-section').classList.remove('hidden');
                container.innerHTML = selectedProduct.variaciones.map((v, i) => {
                    const label = v.color || v.variable || `Opción ${i+1}`;
                    return `<button class="variant-btn ${i === 0 ? 'active' : ''}" onclick="selectVariant(${i}, this)">${label}</button>`;
                }).join('');
            } else {
                document.getElementById('variant-section').classList.add('hidden');
            }

            updateModalInfo();
            
            const modal = document.getElementById('product-modal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.add('opacity-100'), 10);
            
            document.getElementById('add-btn').onclick = () => {
                addToCart();
                closeProductModal();
            };
        }

        function selectVariant(index, btn) {
            selectedVariant = selectedProduct.variaciones[index];
            document.querySelectorAll('.variant-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateModalInfo();
        }

        function updateModalInfo() {
            document.getElementById('modal-img').src = selectedVariant.imagen;
            document.getElementById('modal-sku').innerText = selectedVariant.sku;
            
            const p = selectedVariant.prices;
            document.getElementById('price-1').innerText = `$${p.p1.toLocaleString()}`;
            document.getElementById('price-12').innerText = `$${p.p12.toLocaleString()}`;
            document.getElementById('price-50').innerText = `$${p.p50.toLocaleString()}`;
            document.getElementById('price-100').innerText = `$${p.p100.toLocaleString()}`;
            document.getElementById('price-200').innerText = `$${p.p200.toLocaleString()}`;
            
            document.getElementById('modal-qty').value = 1;
            highlightActivePrice();
        }

        function updateQty(val) {
            const input = document.getElementById('modal-qty');
            input.value = Math.max(1, parseInt(input.value) + val);
            highlightActivePrice();
        }

        function highlightActivePrice() {
            const q = parseInt(document.getElementById('modal-qty').value);
            ['row-1', 'row-12', 'row-50', 'row-100', 'row-200'].forEach(id => document.getElementById(id).classList.remove('price-active'));
            if (q >= 200) document.getElementById('row-200').classList.add('price-active');
            else if (q >= 100) document.getElementById('row-100').classList.add('price-active');
            else if (q >= 50) document.getElementById('row-50').classList.add('price-active');
            else if (q >= 12) document.getElementById('row-12').classList.add('price-active');
            else document.getElementById('row-1').classList.add('price-active');
        }

        function addToCart() {
            const qty = parseInt(document.getElementById('modal-qty').value);
            const item = {
                sku: selectedVariant.sku,
                nombre: selectedProduct.nombre,
                variante: selectedVariant.color || selectedVariant.variable,
                imagen: selectedVariant.imagen,
                qty: qty,
                prices: selectedVariant.prices
            };
            
            const existing = cart.find(i => i.sku === item.sku);
            if (existing) existing.qty += qty;
            else cart.push(item);
            
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            document.getElementById('cart-count').innerText = cart.reduce((a, b) => a + b.qty, 0);
            
            let total = 0;
            container.innerHTML = cart.map((item, i) => {
                const unitPrice = getPrice(item.prices, item.qty);
                total += unitPrice * item.qty;
                return `
                    <div class="flex items-center gap-3 bg-white p-3 rounded-xl border">
                        <img src="${item.imagen}" class="w-12 h-12 object-contain">
                        <div class="flex-grow">
                            <p class="font-bold text-xs leading-tight">${item.nombre}</p>
                            <p class="text-[10px] text-gray-400">${item.variante} | SKU: ${item.sku}</p>
                            <p class="text-fv-blue font-black">$${(unitPrice * item.qty).toLocaleString()}</p>
                        </div>
                        <button onclick="removeFromCart(${i})" class="text-red-400 p-2"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            }).join('');
            document.getElementById('cart-total').innerText = `$${total.toLocaleString()}`;
        }

        function getPrice(prices, q) {
            if (q >= 200) return prices.p200;
            if (q >= 100) return prices.p100;
            if (q >= 50) return prices.p50;
            if (q >= 12) return prices.p12;
            return prices.p1;
        }

        function removeFromCart(i) { cart.splice(i, 1); updateCartUI(); }
        function toggleCart() { document.getElementById('cart-modal').classList.toggle('hidden'); }
        function closeProductModal() {
            document.getElementById('product-modal').classList.remove('opacity-100');
            setTimeout(() => document.getElementById('product-modal').classList.add('hidden'), 300);
        }

        function sendWhatsApp() {
            if (cart.length === 0) return;
            let msg = `🎨 *PEDIDO SUBLIMACIÓN - FORWARDER VENTURE*%0A%0A`;
            cart.forEach(i => {
                msg += `• *${i.nombre}* (${i.variante})%0A   Cant: ${i.qty} | SKU: ${i.sku}%0A`;
            });
            msg += `%0A*TOTAL ESTIMADO: ${document.getElementById('cart-total').innerText}*`;
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`, '_blank');
        }

        loadProducts();
    </script>
</body>
</html>

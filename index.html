<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Forwarder Venture - Sublimación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { background-color: #F8FAFC; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        .text-fv-blue { color: #002e5f; }
        .bg-fv-blue { background-color: #002e5f; }
        .bg-fv-orange { background-color: #e85d04; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .variant-pill {
            border: 1px solid #e2e8f0;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            transition: all 0.2s ease;
            background: white;
            cursor: pointer;
        }
        .variant-pill:hover { border-color: #002e5f; background: #f1f5f9; }
        .variant-pill.active {
            border-color: #002e5f;
            background: #002e5f;
            color: white;
        }

        .price-highlight { background-color: #e85d04; color: white !important; border-radius: 4px; padding: 2px 6px; font-weight: 900; }
    </style>
</head>
<body class="min-h-screen">

    <div class="max-w-[1440px] mx-auto bg-white min-h-screen shadow-xl flex flex-col">
        <header class="bg-white/95 backdrop-blur-md px-6 py-4 sticky top-0 z-50 flex justify-between items-center border-b h-[80px]">
            <img src="logo.png" alt="Forwarder Venture" class="h-10 md:h-12 object-contain">
            <button onclick="toggleCart()" class="relative p-3 hover:bg-gray-100 rounded-full transition">
                <i class="fa-solid fa-cart-shopping text-2xl text-fv-blue"></i>
                <span id="cart-count" class="absolute top-1 right-1 bg-red-600 text-white text-[10px] font-bold h-5 w-5 flex items-center justify-center rounded-full border-2 border-white">0</span>
            </button>
        </header>

        <section class="relative w-full h-[30vh] md:h-[40vh] bg-fv-blue overflow-hidden flex items-end p-6 md:p-12">
            <img src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=1600&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover opacity-40" alt="Sublimación Fondo">
            <div class="absolute inset-0 bg-gradient-to-t from-fv-blue/90 via-fv-blue/30 to-transparent"></div>
            <div class="relative z-10 w-full">
                <span class="bg-orange-600 text-white px-3 py-1 font-black text-xs md:text-sm uppercase tracking-widest mb-3 inline-block rounded-sm shadow-sm">Catálogo Oficial</span>
                <h2 class="text-white font-black text-3xl md:text-5xl leading-none mb-2 drop-shadow-md">SUBLIMACIÓN<br>& DISEÑO</h2>
                <p class="text-gray-100 text-sm md:text-base font-medium max-w-md drop-shadow">Precios especiales por volumen para tu negocio.</p>
            </div>
        </section>

        <div class="sticky top-[80px] z-40 bg-white border-b shadow-sm">
            <nav id="category-nav" class="flex overflow-x-auto gap-3 px-6 py-4 hide-scrollbar"></nav>
        </div>

        <main class="p-6 md:p-10 bg-gray-50 flex-grow">
            <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
        </main>
    </div>

    <div id="product-modal" class="hidden fixed inset-0 bg-black/80 z-[2000] flex items-center justify-center p-4 backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div class="bg-white w-full max-w-5xl rounded-3xl overflow-hidden shadow-2xl relative flex flex-col md:flex-row max-h-[92vh]">
            <button onclick="closeModal()" class="absolute top-5 right-5 w-10 h-10 bg-white shadow-lg rounded-full z-10 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            
            <div class="w-full md:w-1/2 bg-gray-50 p-8 flex items-center justify-center border-b md:border-b-0 md:border-r">
                <img id="modal-img" src="" class="w-full h-auto max-h-[450px] object-contain drop-shadow-xl">
            </div>
            
            <div class="w-full md:w-1/2 p-8 md:p-12 overflow-y-auto flex flex-col">
                <span id="modal-tag" class="text-orange-600 font-black text-xs uppercase tracking-widest mb-2 block">CATEGORÍA</span>
                <h2 id="modal-title" class="text-3xl font-black text-gray-900 leading-tight mb-4">Título</h2>
                <span class="text-gray-400 text-xs font-mono bg-gray-100 px-2 py-1 rounded w-fit mb-6">SKU: <b id="modal-sku" class="text-gray-700"></b></span>

                <div id="variant-section" class="mb-8">
                    <label class="text-[10px] font-black text-gray-400 uppercase mb-3 block">Opciones disponibles:</label>
                    <div id="variant-pills" class="flex flex-wrap gap-2"></div>
                </div>

                <div class="bg-gray-50 rounded-2xl p-6 mb-8 border border-gray-100 relative">
                    <span class="absolute top-4 right-5 text-[10px] font-black text-gray-400 uppercase bg-white px-2 py-1 rounded border border-gray-200 shadow-sm">+ IVA</span>
                    
                    <div class="grid grid-cols-2 gap-y-3 text-sm mt-2">
                        <div id="row-1" class="flex justify-between border-b border-gray-200 pb-2"><span>1+ unidades</span><span id="price-1" class="font-black text-fv-blue"></span></div>
                        <div id="row-12" class="flex justify-between border-b border-gray-200 pb-2"><span>12+ unidades</span><span id="price-12" class="font-black text-fv-blue"></span></div>
                        <div id="row-50" class="flex justify-between border-b border-gray-200 pb-2"><span>50+ unidades</span><span id="price-50" class="font-black text-fv-blue"></span></div>
                        <div id="row-100" class="flex justify-between border-b border-gray-200 pb-2"><span>100+ unidades</span><span id="price-100" class="font-black text-fv-blue"></span></div>
                        <div id="row-200" class="flex justify-between"><span>200+ unidades</span><span id="price-200" class="font-black text-fv-blue"></span></div>
                    </div>
                </div>

                <div class="mt-auto flex gap-4">
                    <div class="flex items-center border-2 border-fv-blue rounded-xl h-14 overflow-hidden bg-white w-32">
                        <button onclick="adjQty(-1)" class="w-10 h-full hover:bg-gray-100 font-bold">-</button>
                        <input type="number" id="modal-qty" value="1" min="1" class="w-full text-center font-black border-none focus:ring-0">
                        <button onclick="adjQty(1)" class="w-10 h-full hover:bg-gray-100 font-bold">+</button>
                    </div>
                    <button id="add-btn" class="flex-grow bg-fv-blue text-white h-14 rounded-xl font-black hover:scale-[1.02] transition">AGREGAR AL PEDIDO</button>
                </div>
            </div>
        </div>
    </div>

    <div id="cart-panel" class="hidden fixed inset-0 bg-black/60 z-[3000] flex justify-end backdrop-blur-sm">
        <div class="bg-white w-full md:max-w-md h-full flex flex-col shadow-2xl">
            <div class="p-6 border-b flex justify-between items-center">
                <h2 class="text-2xl font-black text-fv-blue">Mi Pedido</h2>
                <button onclick="toggleCart()"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div id="cart-list" class="flex-grow overflow-y-auto p-6 space-y-4 bg-gray-50"></div>
            <div class="p-6 bg-white border-t space-y-4">
                <div class="flex justify-between items-end">
                    <span class="text-gray-400 font-bold text-sm">TOTAL ESTIMADO</span>
                    <div class="text-right">
                        <span id="cart-total" class="text-3xl font-black text-fv-blue">$0</span>
                        <p class="text-[10px] font-bold text-gray-400 uppercase mt-1">Valores antes de IVA</p>
                    </div>
                </div>
                <button onclick="checkout()" class="w-full bg-[#25D366] text-white py-4 rounded-2xl font-black text-lg flex justify-center items-center gap-2">
                    <i class="fa-brands fa-whatsapp text-2xl"></i> ENVIAR PEDIDO
                </button>
            </div>
        </div>
    </div>

    <script>
        const WHATSAPP_NUMBER = '3114957971';
        const SHEET_ID = '17a0Pxq1EOLRf86yiuM014ZluVqL2Qj1Mt8cKRDenjHc';
        const GID = '129591070';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

        let catalog = [];
        let cart = [];
        let activeCat = 'Ver Todo';
        let currentProd = null;
        let currentVar = null;

        function init() {
            Papa.parse(CSV_URL, {
                download: true, header: true, skipEmptyLines: true,
                complete: function(results) {
                    const groups = {};
                    results.data.forEach(row => {
                        const pSku = row['PARENT SKU']?.trim();
                        const sku = row['SKU']?.trim();
                        if(!sku) return;

                        const groupID = (pSku && pSku !== "") ? pSku : sku;

                        if (!groups[groupID]) {
                            groups[groupID] = {
                                id: groupID,
                                nombre: row['NOMBRE'],
                                tipo: row['TIPO'] || 'General',
                                variaciones: []
                            };
                        }

                        const cleanP = (v) => parseFloat(v?.toString().replace(/[^0-9.]/g, '')) || 0;
                        
                        groups[groupID].variaciones.push({
                            sku: sku,
                            color: row['COLOR']?.trim() || '',
                            variable: row['VARIABLE']?.trim() || '',
                            img: row['IMAGEN']?.split(',')[0].trim() || 'https://placehold.co/400x400?text=Sin+Imagen',
                            prices: {
                                p1: cleanP(row['PRECIO 1']),
                                p12: cleanP(row['PRECIO 12']) || cleanP(row['PRECIO 1']),
                                p50: cleanP(row['PRECIO 50']) || cleanP(row['PRECIO 1']),
                                p100: cleanP(row['PRECIO 100']) || cleanP(row['PRECIO 1']),
                                p200: cleanP(row['PRECIO 200']) || cleanP(row['PRECIO 1'])
                            }
                        });
                    });
                    catalog = Object.values(groups);
                    renderUI();
                }
            });
        }

        function renderUI() {
            const nav = document.getElementById('category-nav');
            const cats = ['Ver Todo', ...new Set(catalog.map(p => p.tipo))];
            nav.innerHTML = cats.map(c => `
                <button onclick="filter('${c}')" class="px-6 py-2 rounded-full border-2 font-black whitespace-nowrap transition ${activeCat === c ? 'bg-fv-blue text-white border-fv-blue' : 'bg-white text-gray-500 border-gray-100'}">${c}</button>
            `).join('');

            const grid = document.getElementById('product-grid');
            const items = activeCat === 'Ver Todo' ? catalog : catalog.filter(p => p.tipo === activeCat);
            
            // NOTA DE IVA AÑADIDA A LA CUADRÍCULA
            grid.innerHTML = items.map(p => `
                <div class="bg-white rounded-2xl border border-gray-100 p-4 cursor-pointer hover:shadow-xl transition group" onclick="openProduct('${p.id}')">
                    <img src="${p.variaciones[0].img}" class="w-full aspect-square object-contain mb-4">
                    <p class="text-[9px] font-black text-orange-500 uppercase tracking-widest mb-1">${p.tipo}</p>
                    <h3 class="font-bold text-sm h-8 overflow-hidden mb-3 text-gray-800">${p.nombre}</h3>
                    <div class="flex justify-between items-center">
                        <span class="text-fv-blue font-black flex items-baseline gap-1">
                            $${p.variaciones[0].prices.p1.toLocaleString()} 
                            <span class="text-[10px] text-gray-400 font-normal">+IVA</span>
                        </span>
                        <div class="w-8 h-8 bg-gray-100 text-fv-blue rounded-full flex items-center justify-center group-hover:bg-fv-blue group-hover:text-white transition"><i class="fa-solid fa-plus"></i></div>
                    </div>
                </div>
            `).join('');
        }

        function openProduct(id) {
            currentProd = catalog.find(p => p.id === id);
            currentVar = currentProd.variaciones[0];
            document.getElementById('modal-title').innerText = currentProd.nombre;
            document.getElementById('modal-tag').innerText = currentProd.tipo;
            
            const pillBox = document.getElementById('variant-pills');
            if (currentProd.variaciones.length > 1) {
                document.getElementById('variant-section').classList.remove('hidden');
                pillBox.innerHTML = currentProd.variaciones.map((v, i) => `
                    <button class="variant-pill ${i === 0 ? 'active' : ''}" onclick="setVar(${i}, this)">${v.color || v.variable || i+1}</button>
                `).join('');
            } else { document.getElementById('variant-section').classList.add('hidden'); }

            refreshModal();
            document.getElementById('product-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('product-modal').classList.add('opacity-100'), 10);
            
            document.getElementById('add-btn').onclick = () => {
                const qty = parseInt(document.getElementById('modal-qty').value);
                const exists = cart.find(i => i.sku === currentVar.sku);
                if(exists) exists.qty += qty;
                else cart.push({ ...currentVar, nombre: currentProd.nombre, qty: qty });
                updateCart(); closeModal();
            };
        }

        function setVar(idx, btn) {
            currentVar = currentProd.variaciones[idx];
            document.querySelectorAll('.variant-pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            refreshModal();
        }

        function refreshModal() {
            document.getElementById('modal-img').src = currentVar.img;
            document.getElementById('modal-sku').innerText = currentVar.sku;
            const p = currentVar.prices;
            document.getElementById('price-1').innerText = `$${p.p1.toLocaleString()}`;
            document.getElementById('price-12').innerText = `$${p.p12.toLocaleString()}`;
            document.getElementById('price-50').innerText = `$${p.p50.toLocaleString()}`;
            document.getElementById('price-100').innerText = `$${p.p100.toLocaleString()}`;
            document.getElementById('price-200').innerText = `$${p.p200.toLocaleString()}`;
            document.getElementById('modal-qty').value = 1;
            highlightActivePrice();
        }

        function highlightActivePrice() {
            const q = parseInt(document.getElementById('modal-qty').value);
            ['row-1','row-12','row-50','row-100','row-200'].forEach(id => document.getElementById(id).classList.remove('price-highlight'));
            if(q >= 200) document.getElementById('row-200').classList.add('price-highlight');
            else if(q >= 100) document.getElementById('row-100').classList.add('price-highlight');
            else if(q >= 50) document.getElementById('row-50').classList.add('price-highlight');
            else if(q >= 12) document.getElementById('row-12').classList.add('price-highlight');
            else document.getElementById('row-1').classList.add('price-highlight');
        }

        function updateCart() {
            const list = document.getElementById('cart-list');
            document.getElementById('cart-count').innerText = cart.reduce((a, b) => a + b.qty, 0);
            let total = 0;
            
            // NOTA DE IVA AÑADIDA A CADA ÍTEM DEL CARRITO
            list.innerHTML = cart.map((item, i) => {
                const up = getPrice(item.prices, item.qty);
                total += up * item.qty;
                return `
                    <div class="flex items-center gap-3 bg-white p-4 rounded-2xl border border-gray-100">
                        <img src="${item.img}" class="w-12 h-12 object-contain">
                        <div class="flex-grow">
                            <p class="font-black text-xs">${item.nombre}</p>
                            <p class="text-[10px] text-gray-400 uppercase">${item.color} ${item.variable}</p>
                            <p class="text-fv-blue font-black text-sm">$${(up * item.qty).toLocaleString()} <span class="text-[10px] font-normal text-gray-400">+IVA</span></p>
                        </div>
                        <button onclick="del(${i})" class="text-red-300 p-2"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `;
            }).join('');
            document.getElementById('cart-total').innerText = `$${total.toLocaleString()}`;
        }

        function getPrice(ps, q) {
            if(q >= 200) return ps.p200;
            if(q >= 100) return ps.p100;
            if(q >= 50) return ps.p50;
            if(q >= 12) return ps.p12;
            return ps.p1;
        }

        function filter(c) { activeCat = c; renderUI(); }
        function adjQty(v) { 
            const i = document.getElementById('modal-qty');
            i.value = Math.max(1, parseInt(i.value) + v); 
            highlightActivePrice();
        }
        function toggleCart() { document.getElementById('cart-panel').classList.toggle('hidden'); }
        function closeModal() { 
            document.getElementById('product-modal').classList.remove('opacity-100');
            setTimeout(() => document.getElementById('product-modal').classList.add('hidden'), 300);
        }
        function del(i) { cart.splice(i, 1); updateCart(); }

        function checkout() {
            if(cart.length === 0) return;
            
            // Recalculamos el total exacto aquí para el mensaje de WhatsApp
            let totalAntesIVA = cart.reduce((acc, item) => acc + (getPrice(item.prices, item.qty) * item.qty), 0);
            
            let m = `🚀 *PEDIDO - FORWARDER VENTURE*%0A%0A`;
            cart.forEach(i => m += `• *${i.nombre}* (${i.color || i.variable}) x${i.qty}%0A`);
            
            // NOTA DE IVA AÑADIDA AL MENSAJE DE WHATSAPP
            m += `%0A*TOTAL ESTIMADO (Antes de IVA): $${totalAntesIVA.toLocaleString()}*`;
            
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${m}`, '_blank');
        }

        init();
    </script>
</body>
</html>
